name: Sync hash.json files

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Clone source repository
        run: |
          git clone --depth 1 https://github.com/leotorrez/ZZ-Model-Importer-Assets.git upstream

      - name: Extract hash.json
        run: |
          rm -rf hash_temp
          mkdir hash_temp

          find upstream -name "hash.json" -exec cp --parents {} hash_temp/ \;

          find . -name "hash.json" -delete

          cp -r hash_temp/* ./

          rm -rf hash_temp upstream

      - name: Check files
        run: |
          echo "Found hash files:"
          find . -name "hash.json" | head -20

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          git commit -m "Update hash.json files" || echo "No changes"

          git push
